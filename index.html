function spawnCar(z=-135-Math.random()*25,laneIndex=Math.floor(Math.random()*3)){const diff=difficulty(),lane=LANES[laneIndex],colors=[0xe3223e,0x1978df,0xffb21a,0xf0f1f4,0x52b96e,0x7a55d9],car=makeTrafficVisual()||makeCar(colors[Math.floor(Math.random()*colors.length)],Math.random()>.75);car.scale.multiplyScalar(.96+Math.random()*.06);car.position.set(lane,0,z);car.rotation.z=0;scene.add(car);const t={mesh:car,lane,laneIndex,targetLane:laneIndex,changeDelay:0,nextDecision:1+Math.random()*2,indicatorDir:0,changing:false,blink:0,speed:13+diff*2+Math.random()*(8+diff*4),passed:false};if(z<-70&&diff>.55&&Math.random()<Math.min(.28,diff*.1))beginLaneChange(t,diff);traffic.push(t)}

function begin(){if(!trafficModels.length&&performance.now()-pageReadyAt<2600){if(!waitingForTraffic){waitingForTraffic=true;loading.textContent='LOADING TRAFFIC MODELS...';loading.classList.remove('hide')}setTimeout(begin,120);return}waitingForTraffic=false;loading.classList.add('hide');resetWorld();running=true;startTime=last=performance.now();overlay.style.display='none';cancelAnimationFrame(frame);frame=requestAnimationFrame(loop)}
function end(){running=false;paused=false;boosting=false;document.body.classList.remove('boosting');best=Math.max(best,distance);localStorage.setItem('lane-rush-best',best);bestEl.innerHTML=String(best).padStart(4,'0')+'<i> M</i>';document.querySelector('#eyebrow').textContent='RUN ENDED';document.querySelector('#title').innerHTML=distance+' METRES<br><em>RUN IT BACK?</em>';document.querySelector('#copy').textContent='Close calls: '+closeCalls+'. Best run: '+best+' metres.';document.querySelector('#start').innerHTML='RESTART ENGINE <b>→</b>';overlay.style.display='grid'}
function togglePause(){if(!running)return;if(paused){paused=false;last=performance.now();overlay.style.display='none';frame=requestAnimationFrame(loop);return}paused=true;boosting=false;document.body.classList.remove('boosting');document.querySelector('#eyebrow').textContent='PAUSED';document.querySelector('#title').innerHTML='CATCH<br><em>YOUR LINE.</em>';document.querySelector('#copy').textContent='Press P or the button below to resume the run.';document.querySelector('#start').innerHTML='RESUME RUN <b>→</b>';overlay.style.display='grid'}
function updateNitro(){const pct=Math.round(nitro);flow.style.width=pct+'%';nitroBox.className='boost '+(boosting?'active':pct>=99?'ready':'refill');nitroLabel.textContent=boosting?'BOOST':pct>=99?'READY':'REFILL '+pct+'%'}
function showFlash(text){flash.textContent=text;flash.classList.remove('show');void flash.offsetWidth;flash.classList.add('show')}
function difficulty(){return Math.min(2.2,distance/2200)}
function hit(o,k,fallback){return o.userData&&o.userData[k]||fallback}
function addIndicators(car,dir){if(car.userData.indicatorParts)for(const light of car.userData.indicatorParts)car.remove(light);const mat=new THREE.MeshStandardMaterial({color:0xffb21a,emissive:0xff9b00,emissiveIntensity:1.8}),left=new THREE.Mesh(new THREE.BoxGeometry(.22,.12,.08),mat),right=new THREE.Mesh(new THREE.BoxGeometry(.22,.12,.08),mat);left.position.set(-.78,.72,1.92);right.position.set(.78,.72,1.92);car.add(left,right);car.userData.indicatorParts=[left,right];car.userData.indicators=dir<0?[left]:[right]}
function laneClear(t,target){return !traffic.some(o=>o!==t&&Math.abs((o.targetLane??o.laneIndex)-target)<.1&&Math.abs(o.mesh.position.z-t.mesh.position.z)<18)}
function beginLaneChange(t,diff){if(t.indicatorDir||t.mesh.position.z>-45)return;const choices=[];if(t.laneIndex>0)choices.push(t.laneIndex-1);if(t.laneIndex<LANES.length-1)choices.push(t.laneIndex+1);const target=choices.sort(()=>Math.random()-.5).find(i=>laneClear(t,i));if(target==null)return;t.targetLane=target;t.indicatorDir=Math.sign(LANES[target]-LANES[t.laneIndex]);t.changeDelay=Math.max(.7,1.35-diff*.16)+Math.random()*.55;t.changing=false;t.blink=0;addIndicators(t.mesh,t.indicatorDir);for(const light of t.mesh.userData.indicators)light.visible=false}
function moveToward(v,goal,step){return Math.abs(goal-v)<=step?goal:v+Math.sign(goal-v)*step}
function updateTrafficLane(t,dt,diff){t.mesh.position.y=0;t.mesh.rotation.z=0;t.nextDecision-=dt;if(diff>.75&&t.nextDecision<=0&&!t.indicatorDir&&Math.random()<Math.min(.35,diff*.12))beginLaneChange(t,diff);if(!t.indicatorDir)return;t.blink+=dt;const on=Math.floor(t.blink*6)%2===0;if(t.mesh.userData.indicators)for(const light of t.mesh.userData.indicators)light.visible=on;t.changeDelay-=dt;if(t.changeDelay<=0&&laneClear(t,t.targetLane))t.changing=true;if(t.changeDelay<-1.4&&!t.changing){t.indicatorDir=0;if(t.mesh.userData.indicators)for(const light of t.mesh.userData.indicators)light.visible=false;t.nextDecision=1.8+Math.random()*2;return}if(t.changing){const goal=LANES[t.targetLane],step=(1.45+Math.min(diff,2)*.25)*dt;t.mesh.position.x=moveToward(t.mesh.position.x,goal,step);if(t.mesh.position.x===goal){t.laneIndex=t.targetLane;t.lane=goal;t.indicatorDir=0;t.nextDecision=1.8+Math.random()*2;if(t.mesh.userData.indicators)for(const light of t.mesh.userData.indicators)light.visible=false}}}
function loop(now){if(!running||paused)return;const dt=Math.min((now-last)/1000,.04),elapsed=(now-startTime)/1000,diff=difficulty();last=now;boosting=boostHeld&&nitro>1;if(boosting)nitro=Math.max(0,nitro-32*dt);else nitro=Math.min(100,nitro+13*dt);speed=Math.min(320,120+elapsed*4+(boosting?70:0));distance=Math.floor(elapsed*speed*.12+bonusDistance);combo=Math.max(1,combo-dt*.08);const worldSpeed=(22+speed*.16+(boosting?13:0))*dt;velocityX+=steer*(boosting?38:32)*dt;velocityX*=Math.pow(boosting ? .05 : .075,dt);targetX=THREE.MathUtils.clamp(targetX+velocityX*dt,-5.8,5.8);player.position.x=THREE.MathUtils.lerp(player.position.x,targetX,.12);player.rotation.z=THREE.MathUtils.lerp(player.rotation.z,-velocityX*.012,.12);camera.position.x=THREE.MathUtils.lerp(camera.position.x,player.position.x*.34,.07);camera.fov=THREE.MathUtils.lerp(camera.fov,boosting?62:57,.08);camera.updateProjectionMatrix();camera.lookAt(player.position.x*.18,1,-20);underGlow.intensity=boosting?3.4:1.8;exhaustGlow.intensity=boosting?4.8:.35;for(const o of [...roadParts,...laneMarks,...scenery]){o.position.z+=worldSpeed;if(o.position.z>15)o.position.z-=240}for(const o of farScenery){o.position.z+=worldSpeed*.35;if(o.position.z>30)o.position.z-=250}spawnTimer-=dt;if(spawnTimer<=0){spawnCar();if(diff>.55&&Math.random()<Math.min(.34,diff*.12))spawnCar();spawnTimer=Math.max(.34,1.12-diff*.23)+(boosting?0:.14)+Math.random()*Math.max(.12,.26-diff*.04)}for(const t of traffic){t.mesh.position.z+=(worldSpeed-t.speed*dt);updateTrafficLane(t,dt,diff);const dx=Math.abs(t.mesh.position.x-player.position.x),dz=Math.abs(t.mesh.position.z-player.position.z),crashX=(hit(player,'hitWidth',1.34)+hit(t.mesh,'hitWidth',1.18))*.44,crashZ=(hit(player,'hitDepth',3.05)+hit(t.mesh,'hitDepth',2.7))*.44;if(!t.passed&&t.mesh.position.z>1){t.passed=true;if(dx<crashX+1.35&&dz<crashZ+1.4){closeCalls++;combo=Math.min(5,combo+.45);bonusDistance+=Math.round(18*combo);showFlash('CLOSE CALL x'+combo.toFixed(1))}}if(dx<crashX&&dz<crashZ){end();return}}traffic=traffic.filter(t=>{if(t.mesh.position.z<14)return true;scene.remove(t.mesh);return false});distanceEl.innerHTML=String(distance).padStart(4,'0')+'<i> M</i>';speedEl.innerHTML=Math.round(speed)+'<i> KM/H</i>';comboEl.innerHTML=combo.toFixed(1)+'<i>X</i>';document.body.classList.toggle('boosting',boosting);updateNitro();renderer.render(scene,camera);frame=requestAnimationFrame(loop)}
document.querySelector('#start').onclick=()=>paused?togglePause():begin();addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp','Shift',' '].includes(e.key))e.preventDefault();if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')steer=-1;if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')steer=1;if(e.key==='Shift'||e.key==='ArrowUp'||e.key.toLowerCase()==='w')boostHeld=true;if(e.key.toLowerCase()==='p')togglePause();if((e.key===' '||e.key==='Enter')&&!running)begin()});addEventListener('keyup',e=>{if(['ArrowLeft','ArrowRight','a','d','A','D'].includes(e.key))steer=0;if(e.key==='Shift'||e.key==='ArrowUp'||e.key.toLowerCase()==='w')boostHeld=false});function touchSteer(e){if(e.pointerType&&e.pointerType!=='touch')return;steer=e.clientX<W/2?-1:1}renderer.domElement.addEventListener('pointerdown',e=>{touchSteer(e);renderer.domElement.setPointerCapture?.(e.pointerId)});renderer.domElement.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch')touchSteer(e)});renderer.domElement.addEventListener('pointerup',()=>steer=0);renderer.domElement.addEventListener('pointercancel',()=>steer=0);document.querySelectorAll('[data-dir]').forEach(b=>{b.onpointerdown=()=>steer=+b.dataset.dir;b.onpointerup=b.onpointercancel=b.onpointerleave=()=>steer=0});document.querySelectorAll('[data-boost]').forEach(b=>{b.onpointerdown=()=>boostHeld=true;b.onpointerup=b.onpointercancel=b.onpointerleave=()=>boostHeld=false});addEventListener('blur',()=>{steer=0;boostHeld=false});addEventListener('resize',()=>{W=innerWidth;H=innerHeight;camera.aspect=W/H;camera.updateProjectionMatrix();renderer.setSize(W,H)});renderer.render(scene,camera);loading.classList.add('hide');
</script></body></html>
